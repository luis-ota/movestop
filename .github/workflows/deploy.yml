name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Sem concurrency do GitHub: o runner instabox-medium é um slot compartilhado
# e já enfileira jobs de todos os projetos. Nada é cancelado enquanto espera.
env:
  IMAGE: ghcr.io/luis-ota/movestop
  COOLIFY_URL: https://coolify.wired.rs
  SITE_URL: https://movestop.wired.rs

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    # Nunca ubuntu-latest: o CI/CD roda no instabox compartilhado.
    runs-on: instabox-medium
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Instalar dependências
        timeout-minutes: 5
        run: bun install --frozen-lockfile

      - name: Testes antes de publicar
        timeout-minutes: 5
        run: bun test

      - name: Typecheck + build do cliente
        timeout-minutes: 5
        run: bun run build

      - name: Typecheck estrito do servidor
        timeout-minutes: 5
        run: bun run typecheck:server

      - name: Validar imports/sintaxe do servidor
        timeout-minutes: 5
        run: bun build server/index.ts --target=bun --outdir=/tmp/movestop-server-check

      - name: Conferir secrets do Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          [ -n "$COOLIFY_TOKEN" ] || { echo "secret COOLIFY_TOKEN ausente"; exit 1; }
          [ -n "$COOLIFY_APP_UUID" ] || { echo "secret COOLIFY_APP_UUID ausente"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        timeout-minutes: 20
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=movestop
          cache-to: type=gha,mode=max,scope=movestop
          provenance: false
          sbom: false

      - name: Aponta a tag do SHA e dispara o deploy
        id: deploy
        timeout-minutes: 10
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          api="$COOLIFY_URL/api/v1"

          # Token fora do argv: outros processos da caixa compartilhada não o veem.
          cfg=$(mktemp "$RUNNER_TEMP/coolify.XXXXXX")
          trap 'rm -f "$cfg"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$COOLIFY_TOKEN" > "$cfg"
          chmod 600 "$cfg"

          # O painel do Coolify pode responder 522/5xx enquanto o deploy roda.
          pedir() { # pedir MAX METODO URL ARQUIVO [JSON]
            local max=$1 metodo=$2 url=$3 arq=$4 dados=${5:-} codigo=000 t
            for t in $(seq 1 "$max"); do
              if [ -n "$dados" ]; then
                codigo=$(curl -sS --config "$cfg" --max-time 25 -o "$arq" -w '%{http_code}' -X "$metodo" \
                  -H 'Content-Type: application/json' --data "$dados" "$url" || true)
              else
                codigo=$(curl -sS --config "$cfg" --max-time 25 -o "$arq" -w '%{http_code}' -X "$metodo" \
                  "$url" || true)
              fi
              case "$codigo" in 200|201) echo "$codigo"; return 0;; esac
              echo "  tentativa $t/$max: HTTP ${codigo:-000}" >&2
              [ "$t" -lt "$max" ] && sleep 10
            done
            echo "${codigo:-000}"
            return 1
          }

          # Além da tag, reaplica o healthcheck: o padrão do Coolify usa
          # "localhost", que resolve para ::1 no Alpine e o Bun só escuta IPv4.
          patch=$(jq -nc --arg sha "$GITHUB_SHA" '{
            docker_registry_image_tag: $sha,
            health_check_enabled: true,
            health_check_path: "/healthz",
            health_check_port: "8788",
            health_check_host: "127.0.0.1"
          }')
          code=$(pedir 8 PATCH "$api/applications/$COOLIFY_APP_UUID" /tmp/patch.json "$patch")
          echo "PATCH tag/healthcheck: HTTP $code"
          [ "$code" = "200" ] || { head -c 500 /tmp/patch.json; exit 1; }

          # POST é menos idempotente que PATCH: no máximo duas tentativas.
          code=$(pedir 2 POST "$api/deploy?uuid=$COOLIFY_APP_UUID&force=true" /tmp/deploy.json)
          echo "POST deploy: HTTP $code"
          [ "$code" = "200" ] || { head -c 500 /tmp/deploy.json; exit 1; }

          dep=$(jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty' /tmp/deploy.json)
          [ -n "$dep" ] || { echo "sem deployment_uuid na resposta"; head -c 500 /tmp/deploy.json; exit 1; }
          echo "deployment=$dep" >> "$GITHUB_OUTPUT"

      - name: Espera o deployment terminar e a URL responder
        timeout-minutes: 15
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          dep='${{ steps.deploy.outputs.deployment }}'
          cfg=$(mktemp "$RUNNER_TEMP/coolify.XXXXXX")
          trap 'rm -f "$cfg"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$COOLIFY_TOKEN" > "$cfg"
          chmod 600 "$cfg"

          estado() {
            rm -f /tmp/dep.json
            curl -sS --config "$cfg" --max-time 10 -o /tmp/dep.json \
              "$COOLIFY_URL/api/v1/deployments/$dep" 2>/dev/null || true
            jq -r '.status // "?"' /tmp/dep.json 2>/dev/null || echo "?"
          }
          logs() { jq -r '.logs // ""' /tmp/dep.json 2>/dev/null | tail -80; }

          for i in $(seq 1 120); do # 120 × 5 s = 10 min
            code=$(curl -sS --max-time 5 -o /tmp/health.json -w '%{http_code}' "$SITE_URL/healthz" 2>/dev/null || echo 000)
            st=$(estado)
            echo "[$i/120] /healthz => HTTP $code; deployment=$st"
            if [ "$code" = "200" ] && [ "$st" = "finished" ]; then
              echo "deployment concluído e URL saudável"
              exit 0
            fi
            case "$st" in
              failed|cancelled|failed-with-warning)
                echo "Coolify marcou o deployment como falho:"
                logs
                exit 1;;
            esac
            sleep 5
          done
          echo "o deployment não terminou com a URL saudável em 10 min"
          logs
          exit 1

      - name: Confere a tag persistida no Coolify
        timeout-minutes: 3
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          cfg=$(mktemp "$RUNNER_TEMP/coolify.XXXXXX")
          trap 'rm -f "$cfg"' EXIT
          printf 'header = "Authorization: Bearer %s"\n' "$COOLIFY_TOKEN" > "$cfg"
          chmod 600 "$cfg"
          curl -sS --config "$cfg" --max-time 25 \
            "$COOLIFY_URL/api/v1/applications/$COOLIFY_APP_UUID" -o /tmp/app.json
          jq -e --arg sha "$GITHUB_SHA" '.docker_registry_image_tag == $sha' /tmp/app.json >/dev/null
          echo "tag do app confirmada: $GITHUB_SHA"

      - name: Verificar a URL real
        timeout-minutes: 5
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            health=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 10 "$SITE_URL/healthz" || echo 000)
            home=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 10 "$SITE_URL/" || echo 000)
            echo "[$i/12] /healthz => $health $(head -c 80 /tmp/health.json 2>/dev/null || true)"
            echo "[$i/12] / => $home"
            if [ "$health" = "200" ] && [ "$home" = "200" ] && grep -qi "MOVESTOP" /tmp/home.html; then
              echo "deploy verificado: https://movestop.wired.rs"
              exit 0
            fi
            sleep 5
          done
          echo "a URL real não respondeu com o bundle do MOVESTOP"
          exit 1
